name: secret-scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    # Pinned deliberately, NOT ubuntu-latest: GitHub begins migrating
    # ubuntu-latest to Ubuntu 26 on 2026-10-19, and a runner image changing
    # under us is a build that breaks for a reason nobody chose. The owner
    # moves this on purpose, after a green run on the new image.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24; v4.4.0 was node20)
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0 (node24; v2.3.9 was node20)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_VERSION: 8.30.1
