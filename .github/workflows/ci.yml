name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Never a live provider call in CI. This is a throwaway local-only credential
  # for the Postgres service container, not a secret. DATABASE_URL is assembled
  # at runtime (see "Compose DATABASE_URL" step) so no connection string with an
  # embedded password is ever written to this file, consistent with the
  # postgres-connection-string-password gitleaks rule.
  POSTGRES_USER: orchard_ci
  POSTGRES_PASSWORD: orchard_ci
  POSTGRES_DB: orchard_ci

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        # postgres:17.11 as of 2026-09-21; pinned by digest, matches docker-compose.yml.
        image: postgres@sha256:f4c66b820c6f974249089d3d16d86a3698eae11e8746eb6644b2271031e91232
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U orchard_ci -d orchard_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install gitleaks (pinned, checksum-verified)
        # Backs test/gitleaks-regression.test.ts, which shells out to the real
        # binary. Downloads the same release the pre-commit hook and
        # secret-scan.yml pin, and verifies it against gitleaks' own published
        # checksums file rather than trusting the download outright.
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -sSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          curl -sSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          grep "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Compose DATABASE_URL and app role connection string
        # Both assembled at runtime, never as a literal connection string in
        # this file, consistent with the postgres-connection-string-password
        # gitleaks rule. ORCHARD_APP_DB_PASSWORD is a throwaway CI-only value
        # for the service container, not a secret.
        run: |
          MIGRATOR_USERINFO="$POSTGRES_USER:$POSTGRES_PASSWORD"
          APP_USERINFO="orchard_app:$ORCHARD_APP_DB_PASSWORD"
          {
            echo "DATABASE_URL=postgres://${MIGRATOR_USERINFO}@localhost:5432/$POSTGRES_DB"
            echo "ORCHARD_APP_DB_PASSWORD=$ORCHARD_APP_DB_PASSWORD"
            echo "ORCHARD_APP_DATABASE_URL=postgres://${APP_USERINFO}@localhost:5432/$POSTGRES_DB"
          } >> "$GITHUB_ENV"
        env:
          ORCHARD_APP_DB_PASSWORD: orchard_ci_app

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Dependency audit (high/critical)
        run: pnpm audit --audit-level=high

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test -- --passWithNoTests

      - name: Migration up
        run: pnpm migrate:up

      - name: Integration tests against Postgres service container
        run: pnpm test:integration -- --passWithNoTests

      - name: Migration down
        run: pnpm migrate:down
        env:
          ORCHARD_ALLOW_DESTRUCTIVE_MIGRATION: "1"

      - name: Migration up again (idempotency check)
        run: pnpm migrate:up

  # DEC-018: manually-triggered stress run for the per-file integration test
  # isolation mechanism (DEC-017/DEC-018) - not on every push/PR, since 25x
  # the normal integration-test cost isn't worth paying on every commit.
  # Deliberately does not migrate the service container's own database
  # first: db/test-global-setup.ts's template is self-contained (DEC-018),
  # so this also doubles as CI coverage of that property.
  integration-stress:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        # postgres:17.11 as of 2026-09-21; pinned by digest, matches docker-compose.yml.
        image: postgres@sha256:f4c66b820c6f974249089d3d16d86a3698eae11e8746eb6644b2271031e91232
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U orchard_ci -d orchard_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compose DATABASE_URL and app role connection string
        run: |
          MIGRATOR_USERINFO="$POSTGRES_USER:$POSTGRES_PASSWORD"
          APP_USERINFO="orchard_app:$ORCHARD_APP_DB_PASSWORD"
          {
            echo "DATABASE_URL=postgres://${MIGRATOR_USERINFO}@localhost:5432/$POSTGRES_DB"
            echo "ORCHARD_APP_DB_PASSWORD=$ORCHARD_APP_DB_PASSWORD"
            echo "ORCHARD_APP_DATABASE_URL=postgres://${APP_USERINFO}@localhost:5432/$POSTGRES_DB"
          } >> "$GITHUB_ENV"
        env:
          ORCHARD_APP_DB_PASSWORD: orchard_ci_app

      - name: Integration tests x25 (stress)
        run: |
          set -euo pipefail
          for i in $(seq 1 25); do
            echo "=== integration-stress run $i/25 ==="
            pnpm test:integration -- --passWithNoTests
          done
