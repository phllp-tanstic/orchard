title = "Orchard gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "binance-web3-api-secret"
description = "Binance Web3 API secret key assigned to a variable"
regex = '''(?i)BINANCE_WEB3_API_SECRET["']?[ \t]*[=:][ \t]*["']?[A-Za-z0-9+/=_\-]{8,}'''
keywords = ["binance_web3_api_secret"]

[[rules]]
id = "binance-web3-api-key"
description = "Binance Web3 API key assigned to a variable"
regex = '''(?i)BINANCE_WEB3_API_KEY["']?[ \t]*[=:][ \t]*["']?[A-Za-z0-9+/=_\-]{8,}'''
keywords = ["binance_web3_api_key"]

[[rules]]
id = "postgres-connection-string-password"
description = "Postgres connection string with an embedded password assigned to DATABASE_URL"
regex = '''(?i)DATABASE_URL["']?[ \t]*[=:][ \t]*["']?postgres(?:ql)?://[^:@/\s"']+:[^@/\s"']{3,}@[^/\s"']+'''
keywords = ["database_url"]

[allowlist]
description = "Variable names with no value (env templates, captured by the generic rule across a newline), the one synthetic test-fixture secret value, and public on-chain contract addresses the generic rule mistakes for API keys because they sit next to an identifier containing 'token' (DEC-013 A2: exact-value allowlisting only, no path-based exemption)"
regexTarget = "secret"
regexes = [
  '''^BINANCE_WEB3_[A-Z_]+=$''',
  '''^DATABASE_URL=$''',
  '''^SYNTHETIC_TEST_SECRET_0123456789$''',
  # The two provider variable NAMES, standing alone. render.yaml declares each
  # secret as `- key: BINANCE_WEB3_API_SECRET` with `sync: false` and NO value,
  # which is the whole point - Render reads nothing from the file and the owner
  # types the value into the dashboard. The generic rule sees a YAML `key:`
  # followed by a long token and flags the name. Allowlisted by exact value, so
  # this can only ever match the literal name: any real credential differs from
  # it and is still caught.
  '''^BINANCE_WEB3_API_KEY$''',
  '''^BINANCE_WEB3_API_SECRET$''',
  # USDT on BSC, the F001-B probe spend token. A public contract address
  # anyone can read on-chain, not a credential - and never a substitute for
  # one: it grants nothing. Allowlisted by exact value only.
  '''^0x55d398326f99059fF775485246999027B3197955$''',
]
